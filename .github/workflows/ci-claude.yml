# CI + Claude review + merge-on-human-approval for task-tracker.
#
#   1. Tests      every push to main and every PR update: unittest suite on
#                 Python 3.10-3.13, project-rule checks, and a packaging smoke test.
#   2. Claude     a collaborator writes "@claude" in a PR comment, review comment,
#                 review, or the PR description -> Claude reviews the PR and posts
#                 feedback. Claude never approves or merges.
#   3. Merge      a human with write access submits an "Approve" review -> tests run
#                 on that exact commit, and if they pass the PR is squash-merged
#                 (which closes it) and its branch is deleted.
#
# Required repository secret (added by /install-github-app):
#   ANTHROPIC_API_KEY  or  CLAUDE_CODE_OAUTH_TOKEN

name: CI and Claude review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unittest suite (discover tests/)
        # Tests must never see a real task file.
        run: env -u TASK_TRACKER_FILE python -m unittest discover tests -v

      - name: Run unittest suite (discovery from project root)
        run: env -u TASK_TRACKER_FILE python -m unittest

      - name: CLI smoke test
        run: |
          tmp="$(mktemp -d)"
          python main.py --version
          python main.py --file "$tmp/tasks.json" add "CI smoke task" -d "created by CI"
          python main.py --file "$tmp/tasks.json" start 1
          python main.py --file "$tmp/tasks.json" list
          python main.py --file "$tmp/tasks.json" list --json
          python -m task_tracker --file "$tmp/tasks.json" done 1
          python -m task_tracker --file "$tmp/tasks.json" show 1

  checks:
    name: Project rules and packaging
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Code parses as Python 3.10 syntax
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path), feature_version=(3, 10))
              except SyntaxError as exc:
                  bad.append(f"{path}: {exc}")
          print("\n".join(bad) or "All files parse as Python 3.10.")
          sys.exit(1 if bad else 0)
          EOF

      - name: No placeholders (pass / ... / TODO)
        run: |
          if grep -rnE '^\s*pass\s*$|^\s*\.\.\.\s*$|#\s*TODO' task_tracker main.py; then
            echo "Placeholders are not allowed (see CLAUDE.md)."; exit 1
          fi

      - name: requirements.txt has no dependencies
        run: |
          if grep -vE '^\s*(#.*)?$' requirements.txt; then
            echo "task-tracker is standard-library only; requirements.txt must stay empty."; exit 1
          fi

      - name: pip install . and run the console script
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet .
          tmp="$(mktemp -d)"
          /tmp/venv/bin/task-tracker --version
          /tmp/venv/bin/task-tracker --file "$tmp/tasks.json" add "Installed OK"
          /tmp/venv/bin/task-tracker --file "$tmp/tasks.json" list

  # ---------------------------------------------------------------------------
  # 2. Claude review when @claude is mentioned on a PR
  # ---------------------------------------------------------------------------
  claude-review:
    name: Claude review
    if: >-
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && github.event.review.state != 'approved' &&
         contains(github.event.review.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'pull_request' && github.event.action == 'opened' &&
         contains(github.event.pull_request.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claude reviews the PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            REQUESTED BY: @${{ github.actor }}
            REQUEST TEXT:
            ${{ github.event.comment.body || github.event.review.body || github.event.pull_request.body }}

            You were tagged with @claude on this pull request. Review it.

            Read CLAUDE.md first: it lists the hard constraints and the rules the
            code relies on. Then inspect the change with `gh pr view` and
            `gh pr diff`, and run the test suite with
            `python -m unittest discover tests`.

            Check in particular:
            - Correctness bugs and edge cases in the changed code.
            - CLAUDE.md hard constraints: standard library only, Python 3.10
              compatible (no datetime.UTC, typing.Self, ExceptionGroup, ...),
              no pass / ... / TODO placeholders, no hardcoded paths or personal
              data, `from __future__ import annotations` in each module.
            - The rules the code relies on: validate before touching storage,
              never write a corrupt file, never reuse IDs, atomic writes,
              exit codes (0/1/2/3/130), no tracebacks for user errors.
            - Layering: cli -> service -> storage -> models only.
            - Tests: new behaviour is covered, tests use TemporaryDirectory and
              never touch a real tasks.json.
            - Security and performance concerns.

            If the request text asks for something more specific, focus on that.

            Post specific issues as inline comments with
            `mcp__github_inline_comment__create_inline_comment`. Then post one
            summary comment with `gh pr comment` that lists findings by severity,
            the test result, and a verdict: "Looks good to merge" or
            "Changes requested". Do NOT approve, merge, or push to the PR; a
            human approval triggers the merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python -m unittest:*),Bash(python3 -m unittest:*),Read,Glob,Grep"

  # ---------------------------------------------------------------------------
  # 3. Merge after a human approves (and tests pass on that commit)
  # ---------------------------------------------------------------------------
  merge-on-approval:
    name: Merge approved PR
    needs: [test, checks]
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
      github.event.pull_request.draft == false &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      APPROVER: ${{ github.event.review.user.login }}
    steps:
      - name: Confirm the PR is still open and mergeable
        id: precheck
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $state; nothing to merge."
            echo "open=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do
            mergeable=$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)
            [ "$mergeable" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$mergeable" != "MERGEABLE" ]; then
            gh pr comment "$PR_NUMBER" --body "Approved by @$APPROVER, but the PR can't be merged automatically (mergeable: \`$mergeable\`). Resolve conflicts and approve again."
            exit 1
          fi

      - name: Squash-merge, delete the branch (closes the PR)
        if: steps.precheck.outputs.open == 'true'
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh pr comment "$PR_NUMBER" --body "Merged after approval by @$APPROVER; all tests passed on \`${HEAD_SHA:0:7}\`. The PR is closed and its branch deleted."
